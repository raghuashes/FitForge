databases:
  - name: fitforge-db
    databaseName: fitforge
    user: fitforge
    plan: free
    region: oregon
    ipAllowList: []

services:
  - type: web
    name: fitforge-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    healthCheckPath: /api/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DB_URL
        fromDatabase:
          name: fitforge-db
          property: connectionString
      - key: DB_USER
        fromDatabase:
          name: fitforge-db
          property: user
      - key: DB_PASS
        fromDatabase:
          name: fitforge-db
          property: password
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: http://localhost:5173
