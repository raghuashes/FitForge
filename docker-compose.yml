version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: fitforge-postgres
    restart: always
    environment:
      POSTGRES_DB: fitforge
      POSTGRES_USER: fitforge
      POSTGRES_PASSWORD: fitforge_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fitforge -d fitforge"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fitforge-backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://postgres:5432/fitforge
      DB_USER: fitforge
      DB_PASS: fitforge_password
      JWT_SECRET: fitforge-docker-compose-development-secret-key-32chars
      FRONTEND_URL: http://localhost:5173,http://localhost:3000
      PORT: 8080

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: fitforge-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8080/api

volumes:
  postgres_data:
